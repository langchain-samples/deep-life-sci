# Model and effort per role. Edits apply to the next message; no restart needed.
# (A LangSmith deployment keeps the models it was deployed with until the next deploy.)

# Model ids: Anthropic models are bare (e.g. claude-sonnet-5); any other model needs a provider
# prefix (e.g. openai/gpt-5.6-terra)

# Effort must be a level the model supports; leave it empty to omit it
# This is required for models with no effort setting

# Through the LangSmith LLM Gateway, provider API keys go in LangSmith under
# Settings -> Integrations -> Provider Secrets; with your own keys, in .env (setup.py asks)

# Bedrock notes
#
# Prefix the Bedrock model or inference profile id with bedrock/ (bedrock/openai.gpt-...,
# bedrock/us.anthropic.claude-...). Through the LangSmith LLM Gateway, add the
# AWS_BEARER_TOKEN_BEDROCK Provider Secret in LangSmith; with your own Bedrock credentials,
# setup.py puts the key and AWS_REGION in .env
#
# Bedrock serves different models in different regions. Claude runs on Bedrock's standard
# endpoint; every other model runs on Mantle, Bedrock's OpenAI-compatible endpoint, which
# exists in fewer regions and serves fewer models in most of them. The default Bedrock
# models (OpenAI's GPT, the only models with web search on Bedrock) run in us-east-1,
# us-east-2 and us-west-2. A model a region does not serve fails at its first call. To list
# what Mantle serves in a region:
#   curl -H "Authorization: Bearer $AWS_BEARER_TOKEN_BEDROCK" https://bedrock-mantle.<region>.api.aws/v1/models
# For Claude, check model access in the Bedrock console for your region

# Main agent
root:
  model: openai/gpt-5.6-terra  # Anthropic: claude-sonnet-5
  effort: high                 # Anthropic: high

# Sub-agents spawned for tasks like reading papers
subagent:
  model: openai/gpt-5.6-luna   # Anthropic: claude-haiku-4-5-20251001
  effort: low                  # Anthropic: leave empty (Haiku 4.5 has no effort setting)

# Web search
# Note: web search on Bedrock needs one of its GPT models (gpt-5.4 or later); Claude has no web search there
search:
  model: openai/gpt-5.6-luna   # Anthropic: claude-haiku-4-5-20251001
  effort: low                  # Anthropic: leave empty (Haiku 4.5 has no effort setting)

# Judge for LLM-as-a-judge evals in LangSmith
judge:
  model: openai/gpt-5.6-terra  # Anthropic: claude-sonnet-5
  effort: low                  # Anthropic: low

labels:
  openai/gpt-5.6-terra: GPT-5.6 Terra
  openai/gpt-5.6-luna: GPT-5.6 Luna
  openai/gpt-5.6-sol: GPT-5.6 Sol
  claude-sonnet-5: Claude Sonnet 5
  claude-haiku-4-5-20251001: Claude Haiku 4.5
