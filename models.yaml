# Model and effort per role. Edits apply to the next message; no restart needed.
# Model ids: Anthropic models are bare (claude-sonnet-5); any other model needs its provider
# prefix (openai/gpt-5.6-terra). An id without one is refused with a message saying so.
# Effort must be a level your model supports; leave it empty to omit it (required for
# models with no effort setting). Provider API keys go in LangSmith under
# Settings -> Integrations -> Provider Secrets.

# Main agent
root:
  model: openai/gpt-5.6-terra  # Anthropic: claude-sonnet-5
  effort: high                 # Anthropic: high

# Sub-agents spawned for tasks like reading papers
subagent:
  model: openai/gpt-5.6-luna   # Anthropic: claude-haiku-4-5-20251001
  effort: low                  # Anthropic: leave empty (Haiku 4.5 has no effort setting)

# Web search
search:
  model: openai/gpt-5.6-luna   # Anthropic: claude-haiku-4-5-20251001
  effort: low                  # Anthropic: leave empty (Haiku 4.5 has no effort setting)

# Judge for LLM-as-a-judge evals in LangSmith
judge:
  model: openai/gpt-5.6-terra  # Anthropic: claude-sonnet-5
  effort: low                  # Anthropic: low

labels:
  openai/gpt-5.6-terra: GPT-5.6 Terra
  openai/gpt-5.6-luna: GPT-5.6 Luna
  openai/gpt-5.6-sol: GPT-5.6 Sol
  claude-sonnet-5: Claude Sonnet 5
  claude-haiku-4-5-20251001: Claude Haiku 4.5
