# Q8
- id: fmt-cdiff-placebo-trials
  question: >-
    Among published randomised trials of faecal microbiota transplantation for recurrent
    C diff infection, how many were placebo-controlled, and how many reported a cure at
    8 weeks or later?
  expects_artifact: []
  domain: D3 clinical medicine and trials
  rubric: |-
    Seven of 21 randomised trials were placebo-controlled: SER-109 phase 2 (32255488),
    ECOSPOR III (35045228), PUNCH CD2 (29617739), PUNCH CD3 (36287379), PRISM3/CP101
    (39366468), VE303 CONSORTIUM (37060545), and Drekonja's capsule FMT trial (39271107).
    All 21 reported cure at 8 weeks or later.

    Accept 1 of 15 placebo-controlled if the answer restricts to conventional donor-stool
    FMT and says so. Fail if the 8-week count is anything other than all of them, if
    open-label single-arm studies are counted as trials, or if Kelly 2016 (27547925) is
    called placebo-controlled without noting its control arm was autologous FMT.

# Q9
- id: base-editing-t-cells-convergence
  question: >-
    In recent papers base editing primary human T cells, has the field converged on one
    editor format and delivery method? What hasn't converged?
  expects_artifact: []
  domain: D1 molecular and cell biology
  rubric: |-
    Converged: adenine base editors, overwhelmingly the ABE8e family, delivered as mRNA
    by electroporation. Not converged: activation, where CD3/CD28 Dynabeads (bead:cell
    1:1 to 3:1), Miltenyi TransAct and ImmunoCult CD3/CD28/CD2 are all in use, the
    pre-editing window runs 48-72 h, and cytokine support splits between IL-2 alone and
    IL-7 + IL-15.

    Fail if activation is called converged, or if the editor is reported as RNP or plasmid.

# Q10
- id: semaglutide-stopped-trials
  question: >-
    Which phase 3 interventional trials of semaglutide in obesity were terminated,
    withdrawn, or suspended, and what reason did each sponsor give?
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov
  rubric: |-
    Five trials as of August 2026, all found via ClinicalTrials.gov, none of them
    published:

      NCT04741074  TERMINATED  Geisinger Clinic       "low recruitment"
      NCT04885634  WITHDRAWN   Axel Brandes           "Not received funding."
      NCT05444153  WITHDRAWN   Novo Nordisk           "Sponsor decision"
      NCT06619015  WITHDRAWN   Esbjerg Hospital       "suspended by the danish medical agency"
      NCT07357766  WITHDRAWN   Novo Nordisk           "The study is withdrawn due to strategic reasons."

    Credit if the terminated trial and at least three of the withdrawn ones are named by
    NCT number with their stated reason. A sixth trial appearing after August 2026 is not
    a failure; neither is quoting `why_stopped` verbatim, typos in the registry text
    included.

    Fail if a reason is paraphrased into something the registry does not say, if a
    WITHDRAWN trial (zero participants enrolled) is described as having produced or failed
    to produce results, or if the answer searches PubMed for these trials and reports that
    they do not exist.

# Q11
- id: psilocybin-depression-unpublished
  question: >-
    Of the completed interventional trials of psilocybin for depression registered on
    ClinicalTrials.gov, how many have published results and how many appear never to have
    been published? Name the unpublished ones.
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov+pubmed
  rubric: |-
    31 completed interventional trials as of September 2026 — the registry query is the
    denominator, and it grows over time. 18 have a linked publication, 13 have none:

      NCT06372197 NCT04739865 NCT05399498 NCT05624268 NCT04932434 NCT06650800 NCT05581797
      NCT06746441 NCT06230757 NCT05710237 NCT04842045 NCT06235411 NCT05385783

    Require the count the registry returned. Every one of the 13 must be named unpublished,
    or set aside with a stated reason.

    Which trials count as published is a judgment call and any split passes, provided each
    departure from 18/13 is stated with its reason — trials judged off topic, papers that 
    are protocols rather than results.

    Fail an unexplained deviation. Fail a rationale resting on the registry rather than the
    literature: neither "no results posted" nor an empty sponsor-entered publication field
    is evidence a trial is unpublished.

# Q12
- id: hpa-ras-isoform-tissue-heatmap
  question: >-
    Grab the human protein expression data at
    https://www.proteinatlas.org/download/tsv/rna_tissue_consensus.tsv.zip and use it to
    make a heatmap of tissues that most heavily express each RAS isoform. Which tissues
    express each one the most?
  expects_artifact: [image]
  domain: D7 genomics and computational biology
  surface: external+sandbox
  rubric: |-
    HPA consensus nTPM across 51 tissues. Top tissue per isoform:

      HRAS  basal ganglia 123.5
      KRAS  rectum 20.8
      NRAS  bone marrow 55.2

    Require all three isoforms, each with its top tissue named. Actual expression values are
