# Q4
- id: egan-ulk1-ampk-sites
  question: >-
    Which ULK1 sites did the Shaw lab report AMPK phosphorylates, in their 2011 paper on
    autophagy under energy stress?
  expects_artifact: []
  domain: D1 molecular and cell biology
  rubric: |-
    Ser467, Ser555, Thr574 and Ser637, from Egan et al., PMID 21205641.

    Accept "Ser574" for the third position, and accept the three MS-confirmed sites
    (Ser555, Thr574, Ser637) without Ser467. No species qualifier required. Fail on
    Ser317, Ser777 or Ser757.

# Q5
- id: wrapp-spike-ace2-affinity
  question: >-
    In Wrapp's 2020 cryo-EM structure of the prefusion SARS-CoV-2 spike, what affinity did
    they measure for ACE2 binding the spike ectodomain?
  expects_artifact: []
  domain: D5 microbiology and infectious disease
  rubric: |-
    ~15 nM by SPR, for ACE2 binding to the prefusion-stabilised S-2P ectodomain trimer.

    Require the construct as well as the value: this is the ectodomain trimer, not the RBD. Fail on an RBD number.

# Q6
- id: iaccarino-gamma-amyloid
  question: >-
    In Tsai's 2016 Nature paper on 40 Hz gamma entrainment, how much did one hour of
    optogenetic stimulation of FS-PV interneurons in CA1 change amyloid levels in 5XFAD
    mice?
  expects_artifact: []
  domain: D6 neuroscience
  rubric: |-
    A reduction by ELISA: Abeta1-40 down 53.22% and Abeta1-42 down 44.62%, from Iaccarino
    et al., PMID 27929004.

    Both isoforms named, tolerance +/-5 pp. Fail on a single pooled "amyloid" number, on
    plaque number or size, or on the 7-day chronic values.

# Q7
- id: tpd-publication-volume
  question: >-
    How has annual publication volume on targeted protein degradation changed from 2015
    through 2025?
  expects_artifact: [image]
  domain: D2 chemistry and drug discovery
  rubric: |-
    Monotonic, roughly exponential growth. Pass if every year 2015-2025 is reported, 2015 is 30-40, 2025 is 1450-1600, and the
    progression is roughly exponential.

# Q8
- id: fmt-cdiff-placebo-trials
  question: >-
    Among published randomised trials of faecal microbiota transplantation for recurrent
    C diff infection, how many were placebo-controlled, and how many reported a cure at
    8 weeks or later?
  expects_artifact: []
  domain: D3 clinical medicine and trials
  rubric: |-
    Seven of 21 randomised trials were placebo-controlled: SER-109 phase 2 (32255488),
    ECOSPOR III (35045228), PUNCH CD2 (29617739), PUNCH CD3 (36287379), PRISM3/CP101
    (39366468), VE303 CONSORTIUM (37060545), and Drekonja's capsule FMT trial (39271107).
    All 21 reported cure at 8 weeks or later.

    Accept 1 of 15 placebo-controlled if the answer restricts to conventional donor-stool
    FMT and says so. Fail if the 8-week count is anything other than all of them, if
    open-label single-arm studies are counted as trials, or if Kelly 2016 (27547925) is
    called placebo-controlled without noting its control arm was autologous FMT.

# Q9
- id: base-editing-t-cells-convergence
  question: >-
    In recent papers base editing primary human T cells, has the field converged on one
    editor format and delivery method? What hasn't converged?
  expects_artifact: []
  domain: D1 molecular and cell biology
  rubric: |-
    Converged: adenine base editors, overwhelmingly the ABE8e family, delivered as mRNA
    by electroporation. Not converged: activation, where CD3/CD28 Dynabeads (bead:cell
    1:1 to 3:1), Miltenyi TransAct and ImmunoCult CD3/CD28/CD2 are all in use, the
    pre-editing window runs 48-72 h, and cytokine support splits between IL-2 alone and
    IL-7 + IL-15.

    Require at least two named activation reagents and per-paper PMIDs. Fail if
    activation is called converged, or if the editor is reported as RNP or plasmid.
