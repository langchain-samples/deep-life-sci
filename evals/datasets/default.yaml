# Q8
- id: fmt-cdiff-placebo-trials
  question: >-
    Among published randomised trials of faecal microbiota transplantation for recurrent
    C diff infection, how many were placebo-controlled, and how many reported a cure at
    8 weeks or later?
  expects_artifact: []
  domain: D3 clinical medicine and trials
  rubric: |-
    Seven of 21 randomised trials were placebo-controlled: SER-109 phase 2 (32255488),
    ECOSPOR III (35045228), PUNCH CD2 (29617739), PUNCH CD3 (36287379), PRISM3/CP101
    (39366468), VE303 CONSORTIUM (37060545), and Drekonja's capsule FMT trial (39271107).
    All 21 reported cure at 8 weeks or later.

    Accept 1 of 15 placebo-controlled if the answer restricts to conventional donor-stool
    FMT and says so. Fail if the 8-week count is anything other than all of them, if
    open-label single-arm studies are counted as trials, or if Kelly 2016 (27547925) is
    called placebo-controlled without noting its control arm was autologous FMT.

# Q9
- id: base-editing-t-cells-convergence
  question: >-
    In recent papers base editing primary human T cells, has the field converged on one
    editor format and delivery method? What hasn't converged?
  expects_artifact: []
  domain: D1 molecular and cell biology
  rubric: |-
    Converged: adenine base editors, overwhelmingly the ABE8e family, delivered as mRNA
    by electroporation. Not converged: activation, where CD3/CD28 Dynabeads (bead:cell
    1:1 to 3:1), Miltenyi TransAct and ImmunoCult CD3/CD28/CD2 are all in use, the
    pre-editing window runs 48-72 h, and cytokine support splits between IL-2 alone and
    IL-7 + IL-15.

    Fail if activation is called converged, or if the editor is reported as RNP or plasmid.

# Q10 — registry-only. Nothing here is answerable from PubMed: an abandoned trial has no
# paper, and `why_stopped` is free text the sponsor writes at withdrawal.
- id: semaglutide-stopped-trials
  question: >-
    Which phase 3 interventional trials of semaglutide in obesity were terminated,
    withdrawn, or suspended, and what reason did each sponsor give?
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov
  rubric: |-
    Five trials as of August 2026, all found via ClinicalTrials.gov, none of them
    published:

      NCT04741074  TERMINATED  Geisinger Clinic       "low recruitment"
      NCT04885634  WITHDRAWN   Axel Brandes           "Not received funding."
      NCT05444153  WITHDRAWN   Novo Nordisk           "Sponsor decision"
      NCT06619015  WITHDRAWN   Esbjerg Hospital       "suspended by the danish medical agency"
      NCT07357766  WITHDRAWN   Novo Nordisk           "The study is withdrawn due to strategic reasons."

    Credit if the terminated trial and at least three of the withdrawn ones are named by
    NCT number with their stated reason. A sixth trial appearing after August 2026 is not
    a failure; neither is quoting `why_stopped` verbatim including its sponsor typos.

    Fail if a reason is paraphrased into something the registry does not say, if a
    WITHDRAWN trial (zero participants enrolled) is described as having produced or failed
    to produce results, or if the answer searches PubMed for these trials and reports that
    they do not exist.

# Q11 — the bridge. Needs both sources and one of them twice: the registry to enumerate
# what was run, PubMed to test each one for a publication.
- id: psilocybin-depression-unpublished
  question: >-
    Of the completed interventional trials of psilocybin for depression registered on
    ClinicalTrials.gov, how many have published results and how many appear never to have
    been published? Name the unpublished ones.
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov+pubmed
  rubric: |-
    31 completed interventional trials as of September 2026 — the registry query is the
    denominator, and it grows over time. 18 have a linked publication, 13 have none:

      NCT06372197 NCT04739865 NCT05399498 NCT05624268 NCT04932434 NCT06650800 NCT05581797
      NCT06746441 NCT06230757 NCT05710237 NCT04842045 NCT06235411 NCT05385783

    Require the count the registry returned. Every one of the 13 must be named unpublished,
    or set aside with a stated reason.

    Which trials count as published is a judgment call and any split passes, provided each
    departure from 18/13 is stated with its reason — trials judged off topic, papers that 
    are protocols rather than results.

    Fail an unexplained deviation. Fail a rationale resting on the registry rather than the
    literature: neither "no results posted" nor an empty sponsor-entered publication field
    is evidence a trial is unpublished.

# Q12
- id: hpa-ras-isoform-tissue-heatmap
  question: >-
    Grab the human protein expression data at
    https://www.proteinatlas.org/download/tsv/rna_tissue_consensus.tsv.zip and use it to
    make a heatmap of tissues that most heavily express each RAS isoform. Which tissues
    express each one the most?
  expects_artifact: [image]
  domain: D7 genomics and computational biology
  surface: external+sandbox
  rubric: |-
    HPA consensus nTPM across 51 tissues. Top tissue per isoform:

      HRAS  basal ganglia 123.5
      KRAS  rectum 20.8
      NRAS  bone marrow 55.2

    Require all three isoforms, each with its top tissue named. Actual expression values are
    optional; if present, they must agree with the ones above, allowing for rounding.

    Extra RAS-family genes (MRAS, RRAS, RRAS2) are acceptable additions; substring-matching "RAS" 
    and pulling in RASA1, RASGRP or similar is not.

# Q13
- id: mrna-vaccines-lung-cancer-trials
  question: >-
    Are there any mRNA vaccines in ongoing clinical trials against lung cancer? Make a table
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov
  rubric: |-
    Yes. Eleven ongoing interventional trials as of August 2026, all from
    ClinicalTrials.gov, none with a results publication:

      NCT06077760  intismeran autogene (mRNA-4157/V940) + pembrolizumab  MSD        Ph3   recruiting
      NCT06623422  intismeran autogene + pembrolizumab                   MSD        Ph3   recruiting
      NCT07221474  intismeran autogene + pembrolizumab + chemo           MSD        Ph2   recruiting
      NCT07513376  intismeran + SC pembrolizumab                         MSD        Ph3   recruiting
      NCT05142189  BNT116 (mRNA-LPX, 6 TAAs)                             BioNTech   Ph1   recruiting
      NCT05557591  BNT116 + cemiplimab                                   Regeneron  Ph2   active, not recruiting
      NCT06928922  BMD006 inhaled mRNA TAA dry powder vaccine            CAMS       EPh1  recruiting
      NCT07561723  IMP3-saRNA (YMN-136)                                  WCH        Ph1   recruiting
      NCT07652125  RGL-270 neoantigen mRNA + PD-1/PD-L1                  GACT       NA    recruiting
      NCT06685653  RGL-270 + adebrelimab                                 Tianyinshan EPh1 not yet recruiting
      NCT06735508  neoantigen mRNA vaccine + adebrelimab                 GDPH       EPh1  not yet recruiting

    A table must be produced, either as markdown or as a file, with all 11 trial numbers included.

    Also credit, do not require: mRNA-4359 NCT05533697 and mRNA-4157 NCT03313778, both
    solid-tumour baskets with named NSCLC cohorts; EVM14 NCT07614646, ABO2109 NCT07683832
    and TMT101 NCT06861543, whose records name a cancer vaccine or mRNA but not both; the
    inhaled mRNA platform NCT07657611.

    Fail if COVID-19 mRNA vaccines given to lung cancer patients are listed as mRNA vaccines 
    against lung cancer (NCT07597070, NCT05672355, NCT04977024, NCT06168032). Fail on "no" 
    or "none found". Fail if a non-mRNA cancer vaccine is listed as mRNA: OSE2101 (peptide), 
    CIMAvax-EGF (protein), Microlyvaq NCT07285434 (peptide), STEMVAC (plasmid DNA), UV1 
    (peptide), any dendritic-cell vaccine. Fail if an mRNA therapeutic that is not a vaccine 
    is counted — mRNA IL-12 (ABO2011, STX-003, JCXH-211) or CRISPR mRNA (EDB-102). Fail if 
    NCT07745790 is included: its KRAS G12V mRNA vaccine treats pancreatic cancer with lung 
    metastases. Fail if any closed trial is presented as ongoing — CV9201 NCT01915524 
    (terminated), CV9202/BI 1361849 NCT03164772 (completed), mRNA-5671/V941 NCT03948763 
    (terminated).

# Q14 — web-only fact with a literature bridge. A label change is a regulatory action:
# it has no paper of its own, but the evidence behind it does, so the answer has to come
# off the agency site and out of PubMed and keep the two straight.
- id: car-t-secondary-malignancy-label
  question: >-
    What did FDA change about the boxed warnings on approved CAR-T products, and is the
    evidence behind it published?
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: web+pubmed
  rubric: |-
    January 2024: FDA required a class-wide boxed warning for secondary T-cell
    malignancies on the six BCMA- or CD19-directed autologous CAR-T products approved at
    the time — Abecma, Breyanzi, Carvykti, Kymriah, Tecartus, Yescarta — cited to FDA by
    URL. The published evidence is cited separately, to PubMed, with resolvable PMIDs.

    Require only those: the 2024 date, the class-wide scope, the malignancy type, an FDA
    URL, and PMIDs. Accept April 2024, the date on FDA's own safety communication.
    Accept the six products counted rather than named.

    Everything else is optional and must not be marked missing — including the sponsor
    letter date, the November 2023 investigation, life-long monitoring, the October 2025
    addition of IEC-EC to Carvykti's boxed warning, and the June 2025 REMS elimination.

    Fail if an FDA action is attributed to a journal article, or a web source is presented
    as peer-reviewed evidence. Fail if a boxed warning is reported as withdrawn. Fail if
    IEC-EC is given as class-wide, or the T-cell malignancy warning as Carvykti-only.

# Q15 — web numbers into the sandbox. The counts are agency statistics with no PubMed
# record; the trend, the baseline and the plot are the agent's own work.
- id: fda-novel-approvals-trend
  question: >-
    Plot CDER novel drug approvals per year since 2010 and tell me how 2025 compared to
    the average
  expects_artifact: [image]
  domain: D2 chemistry and drug discovery
  surface: web+sandbox
  rubric: |-
    CDER novel drug approvals — new molecular entities under NDAs plus new therapeutic
    biologics under BLAs — from FDA's annual novel-drug pages:

      2010 21   2014 41   2018 59   2022 37
      2011 30   2015 45   2019 48   2023 55
      2012 39   2016 22   2020 53   2024 50
      2013 27   2017 46   2021 50   2025 46

    2016-2025 mean is 46.6, so 2025 at 46 is essentially at the decade average

    Require a plot, every year 2010-2025 present, an FDA URL, and 2025 compared against a
    stated baseline. Counts must match the values above. Any defensible decade window 
    passes provided the answer says which one it used and its average is right for
    that window; "roughly at the average" and "slightly below" both pass.

    Fail if the counts are recalled rather than sourced, if CBER products (vaccines, gene
    and cell therapies) are folded into the totals without saying so, if the comparison is
    made without stating the baseline, or if 2025 is characterised as a sharp drop.
