    Extra RAS-family genes (MRAS, RRAS, RRAS2) are acceptable additions; substring-matching "RAS" 
    and pulling in RASA1, RASGRP or similar is not.

# Q13
- id: mrna-vaccines-lung-cancer-trials
  question: >-
    Are there any mRNA vaccines in ongoing clinical trials against lung cancer? Make a table
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov
  rubric: |-
    Yes. Eleven ongoing interventional trials as of August 2026, all from
    ClinicalTrials.gov, none with a results publication:

      NCT06077760  intismeran autogene (mRNA-4157/V940) + pembrolizumab  MSD        Ph3   recruiting
      NCT06623422  intismeran autogene + pembrolizumab                   MSD        Ph3   recruiting
      NCT07221474  intismeran autogene + pembrolizumab + chemo           MSD        Ph2   recruiting
      NCT07513376  intismeran + SC pembrolizumab                         MSD        Ph3   recruiting
      NCT05142189  BNT116 (mRNA-LPX, 6 TAAs)                             BioNTech   Ph1   recruiting
      NCT05557591  BNT116 + cemiplimab                                   Regeneron  Ph2   active, not recruiting
      NCT06928922  BMD006 inhaled mRNA TAA dry powder vaccine            CAMS       EPh1  recruiting
      NCT07561723  IMP3-saRNA (YMN-136)                                  WCH        Ph1   recruiting
      NCT07652125  RGL-270 neoantigen mRNA + PD-1/PD-L1                  GACT       NA    recruiting
      NCT06685653  RGL-270 + adebrelimab                                 Tianyinshan EPh1 not yet recruiting
      NCT06735508  neoantigen mRNA vaccine + adebrelimab                 GDPH       EPh1  not yet recruiting

    A table must be produced, either as markdown or as a file, with all 11 trial numbers included.

    Also credit, do not require: mRNA-4359 NCT05533697 and mRNA-4157 NCT03313778, both
    solid-tumour baskets with named NSCLC cohorts; EVM14 NCT07614646, ABO2109 NCT07683832
    and TMT101 NCT06861543, whose records name a cancer vaccine or mRNA but not both; the
    inhaled mRNA platform NCT07657611.

    Fail if COVID-19 mRNA vaccines given to lung cancer patients are listed as mRNA vaccines 
    against lung cancer (NCT07597070, NCT05672355, NCT04977024, NCT06168032). Fail on "no" 
    or "none found". Fail if a non-mRNA cancer vaccine is listed as mRNA: OSE2101 (peptide), 
    CIMAvax-EGF (protein), Microlyvaq NCT07285434 (peptide), STEMVAC (plasmid DNA), UV1 
    (peptide), any dendritic-cell vaccine. Fail if an mRNA therapeutic that is not a vaccine 
    is counted — mRNA IL-12 (ABO2011, STX-003, JCXH-211) or CRISPR mRNA (EDB-102). Fail if 
    NCT07745790 is included: its KRAS G12V mRNA vaccine treats pancreatic cancer with lung 
    metastases. Fail if any closed trial is presented as ongoing — CV9201 NCT01915524 
    (terminated), CV9202/BI 1361849 NCT03164772 (completed), mRNA-5671/V941 NCT03948763 
    (terminated).

# Q14
- id: car-t-secondary-malignancy-label
  question: >-
    What did FDA change about the boxed warnings on approved CAR-T products, and is the
    evidence behind it published?
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: web+pubmed
  rubric: |-
    January 2024: FDA required a class-wide boxed warning for secondary T-cell
    malignancies on the six BCMA- or CD19-directed autologous CAR-T products approved at
    the time — Abecma, Breyanzi, Carvykti, Kymriah, Tecartus, Yescarta — cited to FDA by
    URL. The published evidence is cited separately, to PubMed, with resolvable PMIDs.

    Require only those: the 2024 date, the class-wide scope, the malignancy type, an FDA
    URL, and PMIDs. Accept April 2024, the date on FDA's own safety communication.
    Accept the six products counted rather than named.

    Everything else is optional and must not be marked missing — including the sponsor
    letter date, the November 2023 investigation, life-long monitoring, the October 2025
    addition of IEC-EC to Carvykti's boxed warning, and the June 2025 REMS elimination.

    Fail if an FDA action is attributed to a journal article, or a web source is presented
    as peer-reviewed evidence. Fail if a boxed warning is reported as withdrawn. Fail if
    IEC-EC is given as class-wide, or the T-cell malignancy warning as Carvykti-only.

# Q15
- id: fda-novel-approvals-trend
  question: >-
    Plot CDER novel drug approvals per year since 2010 and tell me how 2025 compared to
    the average
  expects_artifact: [image]
  domain: D2 chemistry and drug discovery
  surface: web+sandbox
  rubric: |-
    CDER novel drug approvals — new molecular entities under NDAs plus new therapeutic
    biologics under BLAs — from FDA's annual novel-drug pages:

      2010 21   2014 41   2018 59   2022 37
      2011 30   2015 45   2019 48   2023 55
      2012 39   2016 22   2020 53   2024 50
      2013 27   2017 46   2021 50   2025 46

    2016-2025 mean is 46.6, so 2025 at 46 is essentially at the decade average

    Require a plot, every year 2010-2025 present, an FDA URL, and 2025 compared against a
    stated baseline. Counts must match the values above. Any defensible decade window 
    passes provided the answer says which one it used and its average is right for
    that window; "roughly at the average" and "slightly below" both pass.

    Fail if the counts are recalled rather than sourced, if CBER products (vaccines, gene
    and cell therapies) are folded into the totals without saying so, if the comparison is
    made without stating the baseline, or if 2025 is characterised as a sharp drop.

# Q16
- id: step1-posted-nausea-serious-ae
  question: >-
    From the posted results for NCT03548935, how many participants in each arm experienced nausea, and how many experienced any serious AE? Distinguish the number of nausea events from the number of people affected.
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov-results
  notes: >-
    Verified 2026-09-16 against https://clinicaltrials.gov/api/v2/studies/NCT03548935
    (last update 2021-11-19). Source fields:
    resultsSection.adverseEventsModule.otherEvents and seriousEvents, term=Nausea,
    plus eventGroups.seriousNumAffected. Important correction to the preliminary scan:
    the registry also lists one serious nausea event in one semaglutide participant.
  rubric: |-
    STEP 1, NCT03548935. Arm order below is semaglutide 2.4 mg versus placebo.

    REQUIRED:
    - Nausea: 576 versus 114 participants affected; 1,067 versus 146 nausea events.
      Clearly distinguish event counts from the number of people affected.
    - Any serious adverse event, across all types: 128 semaglutide participants
      versus 42 placebo participants. These are people, not numbers of SAE episodes.
    - Ground the answer in the posted registry results, identifying NCT03548935.

    Passing requires answering the question above, not a separate analysis of nausea
    seriousness categories. Accept the required nausea counts labelled simply as
    "nausea" or "participants with nausea". Do not fail an otherwise correct answer
    for omitting the non-serious/other-events label, separate serious-nausea reporting,
    or a discussion of overlap/deduplication between seriousness categories.

    OPTIONAL: The registry separately lists serious nausea as 1 event in 1 semaglutide
    participant and 0 events in 0 placebo participants. Accept 1,068 semaglutide nausea
    events if identified as the sum of 1,067 non-serious plus 1 serious event.
    Also accept 576-577 as the possible unique semaglutide participant count if the
    answer explains that overlap between the two categories is unknown. None of
    these additional distinctions is required to pass.

    OPTIONAL, not required by this question: safety denominators 1,306 versus 655;
    non-serious nausea percentages approximately 44.1% versus 17.4%; any-SAE
    percentages approximately 9.8% versus 6.4%; safety analysis includes anyone
    receiving at least one dose, with a week-0-to-week-75 reporting window.
    If provided, these details must agree with the registry. Do not require an
    artifact, a specific tool sequence, or a discussion of the reporting threshold.

    Fail on missing or incorrect required counts, swapped arms, or conflating event
    counts with people affected. If the answer chooses to calculate additional totals,
    fail on adding person counts across seriousness categories as if disjoint or
    summing individual SAE categories to calculate people with any serious AE.

# Q17
- id: mapp1-mapp2-posted-score-changes
  question: >-
    Compare the posted CAPS-5 and disability-score changes in MAPP1 and MAPP2. For each trial and endpoint, report the MDMA-assisted therapy and placebo-with-therapy arm sizes, least-squares mean changes, 95% CIs and assessment time. Calculate the difference between the posted arm estimates within each trial
  expects_artifact: []
  domain: D3 clinical medicine and trials
  surface: ctgov-results+multi-trial
  notes: >-
    Verified 2026-09-16 against https://clinicaltrials.gov/api/v2/studies/NCT03537014
    (MAPP1) and https://clinicaltrials.gov/api/v2/studies/NCT04077437 (MAPP2), both
    last updated 2025-06-06. Source: resultsSection.outcomeMeasuresModule.
    Differences checked with decimal
    subtraction of posted arm estimates, not publication estimates. Results-only
    fresh-cache requests give a file-backed MAPP1 and inline MAPP2 at the current
    24,000-byte threshold; grading concerns the answer, not this implementation detail.
  rubric: |-
    MAPP1 = NCT03537014; MAPP2 = NCT04077437. Report both trials and both endpoints,
    using posted least-squares mean changes and arm-level 95% confidence intervals.
    MDMA-assisted therapy is compared with placebo WITH therapy in both trials.

    REQUIRED VALUES (MDMA first, then placebo; all changes are score points):

      Trial  Endpoint  MDMA n  MDMA change [95% CI]          Placebo n  Placebo change [95% CI]     MDMA minus placebo
      MAPP1  CAPS-5    46      -24.50 [-28.28, -20.71]       44         -12.64 [-16.61, -8.66]      -11.86
      MAPP1  SDS       46       -3.15 [ -3.90,  -2.40]       44          -1.79 [ -2.58, -1.00]       -1.36
      MAPP2  CAPS-5    53      -23.69 [-26.94, -20.44]       50         -14.78 [-18.28, -11.28]       -8.91
      MAPP2  SDS       53       -3.31 [ -4.03,  -2.60]       50          -2.11 [ -2.89, -1.33]       -1.20

    Assessment time for both endpoints in both trials: baseline to approximately
    18 weeks after enrollment confirmation. Accept "baseline to week 18". The MAPP2
    CAPS-5 timeFrame has redundant wording ("post baseline post enrollment
    confirmation"); reproducing that wording is not required.

    The disability endpoint is the Sheehan Disability Scale (SDS); both records
    describe adapted scoring using the mean of three items on a 0-10 scale.
    MAPP2 includes "Adapted" in the outcome title. Accept SDS or adapted SDS for
    either trial; do not require the scoring-range explanation, but reject a claim
    that these posted changes use a 0-30 summed score.

    Require all four calculated between-arm differences, with subtraction direction
    clear. Positive 11.86, 1.36, 8.91 and 1.20 are acceptable if labelled as greater
    reduction with MDMA or as placebo minus MDMA. They are calculations from the
    rounded posted arm estimates, not separately reported treatment-effect analyses.
    Arm sizes and time may be stated once per trial if their application to both
    endpoints is unambiguous. Accept exact values or consistent rounding to one
    decimal place (within 0.05 of each listed estimate, CI endpoint and difference).

    Fail if a trial or endpoint, arm size, arm-level CI, assessment time, or calculated
    difference is missing. Fail on substituting raw/published mean changes for the
    posted LS means, confusing score changes with remission rates, using completer
    counts instead of posted outcome denominators, or treating arm-level CIs as CIs
    for the differences. Do not require a pooled effect, comparison of effect sizes
    between trials, inferential CI for a difference, artifact, or specific tool sequence.
