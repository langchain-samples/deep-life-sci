# Seeds for the LangSmith dataset `deep-life-sci-default`. Pushed by `evals/sync.py`,
# which matches on `id` — rewording a question updates its example rather than replacing
# it, so keep ids stable even when the text around them changes.
#
# Per example: `id` and `question` are required. `expects_artifact` and `rubric` become
# reference outputs the evaluators compare against; `domain`, `surface` and `notes` are
# provenance only. Rubrics are graded by a model, not string-matched, so they are written
# for a reader: state what the right answer contains, then what earns credit and what
# fails outright.

# Q1
- id: semaglutide-weightloss-boxplot
  question: >-
    Identify all phase 3 studies of semaglutide for weight management in adults with
    overweight or obesity, and make a box plot of the effect sizes for weight loss
  expects_artifact: [image]
  rubric: |-
    The STEP and OASIS programmes, 19 published trials. For each: trial name with its
    number, PMID, and effect size.

    REQUIRED:
      STEP 1         33567185  -12.4
      STEP 2         33667417   -6.2
      STEP 3         33625476  -10.3
      STEP 4         33755728  -14.8
      STEP 5         36216945  -12.6
      STEP 6         35131037  -11.1
      STEP 7         38330988   -8.5
      STEP 8         35015037   -9.4
      STEP 9         39476339  -10.5
      STEP 10        39089293  -11.2
      STEP 11        40825340  -12.9
      STEP 12        42575111   -9.9
      STEP UP        40961952  -14.8
      STEP UP T2D    40961953   -9.3
      OASIS 1        37385278  -12.7
      OASIS 2        40758358  -13.07
      OASIS 3        NA        NA
      OASIS 4        40934115  -11.4

    OPTIONAL:
      STEP-HFpEF     37622681  -10.7
      STEP-HFpEF DM  38587233   -6.4

    Effect sizes are placebo- or comparator-subtracted differences in percent body weight
    change, in percentage points; median -11.1, range -14.8 to -6.2.

    All REQUIRED trials must be present. OASIS 3 must be mentioned, but no results have been
    published yet, so it should not be in the plot. The HFpEF trials may be included or excluded, 
    but if they are mentioned, the agent must note that weight loss was not their primary 
    endpoint. Effect sizes must be within 0.5pp.

