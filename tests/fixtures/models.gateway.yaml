# The model defaults the offline tests run against, pinned by tests/conftest.py so an edit
# to the repository's models.gateway.yaml cannot decide whether an assertion holds. Mirrors the
# shipped defaults; change both together. Tests that need the user's own keys switch
# `access` with the `direct` fixture (tests/conftest.py).

access: gateway

root:
  model: openai/gpt-5.6-terra
  effort: high

subagent:
  model: openai/gpt-5.6-luna
  effort: low

search:
  model: openai/gpt-5.6-luna
  effort: low

judge:
  model: openai/gpt-5.6-terra
  effort: low

labels:
  openai/gpt-5.6-terra: GPT-5.6 Terra
  openai/gpt-5.6-luna: GPT-5.6 Luna
  openai/gpt-5.6-sol: GPT-5.6 Sol
  claude-sonnet-5-5: Claude Sonnet 5.5
  claude-sonnet-5: Claude Sonnet 5
  claude-haiku-4-5-20251001: Claude Haiku 4.5
