# Model and effort per role, on OpenAI with your own API key. Used when MODELS_FILE in .env
# says models.openai.yaml, which setup.py writes when you choose your own OpenAI key.
# Edits apply to the next message; no restart needed.

# Model ids keep their openai/ prefix, as in models.gateway.yaml; it is dropped on the way out

# Effort must be a level the model supports; leave it empty to omit it

# How model calls are made: straight to OpenAI, with OPENAI_API_KEY in .env
access: direct

# Main agent
root:
  model: openai/gpt-5.6-terra
  effort: high

# Sub-agents spawned for tasks like reading papers
subagent:
  model: openai/gpt-5.6-luna
  effort: low

# Web search
search:
  model: openai/gpt-5.6-luna
  effort: low

# Judge for LLM-as-a-judge evals in LangSmith
judge:
  model: openai/gpt-5.6-terra
  effort: low

labels:
  openai/gpt-5.6-terra: GPT-5.6 Terra
  openai/gpt-5.6-luna: GPT-5.6 Luna
  openai/gpt-5.6-sol: GPT-5.6 Sol
