[project]
name = "deepagents-testing"
version = "0.1.0"
description = "Minimal Deep Agents scaffold with LangSmith tracing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.4",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.5.3",
    "langchain-openai>=1.4.2",
    "langchain-quickjs>=0.3.5",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
# `langgraph dev` serves graph.py so a chat UI can connect. The CLI is only needed for
# that path — `uv run agent.py` doesn't touch it. [inmem] is the in-process server;
# without that extra the `dev` subcommand isn't registered at all.
dev = [
    "langgraph-cli[inmem]>=0.4.7",
]
